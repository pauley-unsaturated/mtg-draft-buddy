# Pretraining corpus manifest v1 (PLAN Phase 3). Consumed by the streaming
# dataloader AND tests/test_quarantine.py. The quarantine list is absolute:
# those sets must never appear in `sets`, warm-start sources, or scaler fits.
quarantine:
  - MSH

# Per-set draft cap to balance eras / bound epoch cost.
max_drafts_per_set: 40000

# weight 2.0 = play-booster era (rules environment matches future sets).
