# EXP-031: fine-tune the EXP-030 pretrained trunk on full MSH (deliverable #2).
# Fresh zero-init MSH card table trains on top of the feature pathway; corpus
# scaler reused (stats-leakage discipline).
exp: EXP-031
model: modern
set: MSH
stats: full
seed: 17
batch_drafts: 64
epochs: 15
patience: 3
emb_dim: 256
layers: 8
heads: 8
t_max: 45
dropout: 0.1
use_set_encoder: true
pointer_head: true
feature_only: true
use_set_token: true
init_from: checkpoints/EXP-030
scaler_from: checkpoints/EXP-030
weighting: importance
priors: false
label_smoothing: 0.05
peak_lr: 1.0e-4
lr_warmup: 300
weight_decay: 0.01
grad_clip: 1.0
