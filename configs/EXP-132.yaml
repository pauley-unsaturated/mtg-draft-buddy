# SEALED corpus pretrain from scratch — the control for EXP-131's warm start.
# Same manifest, same recipe as EXP-126 (which was scratch-trained), own
# corpus-fit scaler.
exp: EXP-132
task: deck
model: builder
corpus: configs/corpus/sealed_v1.yaml
seed: 17
batch_builds: 256
epochs: 24
patience: 3
emb_dim: 128
heads: 8
blocks: 3
dropout: 0.1
weighting: uniform
land_lambda: 0.2
basics_lambda: 0.5
stat_dropout: 0.25
peak_lr: 3.0e-4
lr_warmup: 1000
weight_decay: 0.01
grad_clip: 1.0
