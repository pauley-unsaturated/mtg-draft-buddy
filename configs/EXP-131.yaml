# SEALED corpus pretrain, warm-started from the draft-deck trunk (P5.S).
# Hypothesis: draft-deck knowledge (card quality, curves, manabases) transfers;
# the sealed corpus (~25x smaller than decks_v2) teaches the missing skill —
# color choice from an 84-card unfiltered pool. Control: EXP-132 (scratch).
exp: EXP-131
task: deck
model: builder
corpus: configs/corpus/sealed_v1.yaml
seed: 17
init_from: checkpoints/EXP-126
scaler_from: checkpoints/EXP-126
batch_builds: 256
epochs: 24
patience: 3
emb_dim: 128
heads: 8
blocks: 3
dropout: 0.1
weighting: uniform
land_lambda: 0.2
basics_lambda: 0.5
stat_dropout: 0.25
peak_lr: 1.5e-4
lr_warmup: 300
weight_decay: 0.01
grad_clip: 1.0
