# JOINT draft+sealed pretrain with a format token (owner directive 2026-08-01:
# "a good deck is a good deck in limited" — let sealed borrow the 3.7M-build
# draft gradient; the zero-init format embedding learns the sealed delta,
# e.g. bombs weighted up). Warm start x high LR per the EXP-134 lesson.
# Sealed boost 4.0 -> sealed ~27% of samples (natural share is 8%).
exp: EXP-135
task: deck
model: builder
formats: true
corpora:
  - manifest: configs/corpus/decks_v2.yaml
  - manifest: configs/corpus/sealed_v1.yaml
    boost: 4.0
seed: 17
init_from: checkpoints/EXP-126
scaler_from: checkpoints/EXP-126
batch_builds: 256
epochs: 14
patience: 4
emb_dim: 128
heads: 8
blocks: 3
dropout: 0.1
weighting: uniform
land_lambda: 0.2
basics_lambda: 0.5
stat_dropout: 0.25
peak_lr: 3.0e-4
lr_warmup: 1000
weight_decay: 0.01
grad_clip: 1.0
