# Sealed annealing of the joint trunk EXP-135 — UNIFORM control.
# Continue-train on the sealed corpus only (format token stays sealed=1),
# fine-tune LR. Paired with EXP-137 (win_skill) to test the owner's bombs
# hypothesis: sealed should be fine-tuned toward WINNING sealed decks.
exp: EXP-136
task: deck
model: builder
formats: true
corpus: configs/corpus/sealed_v1.yaml
seed: 17
init_from: checkpoints/EXP-135
scaler_from: checkpoints/EXP-135
batch_builds: 256
epochs: 24
patience: 3
emb_dim: 128
heads: 8
blocks: 3
dropout: 0.1
weighting: uniform
land_lambda: 0.2
basics_lambda: 0.5
stat_dropout: 0.25
peak_lr: 1.5e-4
lr_warmup: 300
weight_decay: 0.01
grad_clip: 1.0
