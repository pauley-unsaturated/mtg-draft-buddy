[project]
name = "draftbot"
version = "0.1.0"
description = "Modernized MTG draft transformer (fork of RyanSaxe/mtg)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "pyarrow>=16",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
draftbot = "draftbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
